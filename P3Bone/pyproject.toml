[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p3bone"
version = "1.0.0"
description = "Pseudo-label error calibration and local target reconstruction for bone segmentation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "P3Bone contributors"}]
maintainers = [{name = "Shihao Qin", email = "1310434684@qq.com"}]
dependencies = ["torch==2.8.0", "numpy==2.0.1", "scipy==1.17.0", "Pillow==10.4.0", "pandas==2.3.3"]

[project.optional-dependencies]
upstream = ["torchvision==0.23.0", "hydra-core==1.3.2", "omegaconf==2.3.0", "PyYAML==6.0.2"]

[project.scripts]
p3bone = "p3bone.__main__:main"

[tool.setuptools.packages.find]
include = ["p3bone*"]
